<title>工资四分法 · 离线版</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#141821; --panel2:#1a1f2b; --line:#242b39;
    --ink:#e8ecf5; --muted:#8892a6; --gold:#e8b25f; --gold-dim:#a8802f;
    --ok:#5fd0b0; --warn:#f0b45f; --bad:#f08a8a;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(120% 60% at 10% -10%, #1c2333 0%, transparent 55%),
      radial-gradient(100% 55% at 95% 108%, #21202e 0%, transparent 55%),
      var(--bg);
    color:var(--ink);min-height:100vh;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    overscroll-behavior-y:contain;
    padding-left:var(--sal);padding-right:var(--sar);
  }
  .app{max-width:720px;margin:0 auto;padding-bottom:calc(96px + var(--sab))}

  /* ---------- 背景：主页面 ---------- */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-color:var(--page-bg-c,transparent);
    background-image:var(--page-bg-i,none);
    background-size:cover;
    background-position:var(--page-bg-p,center);
    opacity:var(--page-bg-o,1);
    filter:blur(var(--page-bg-b,0px));
    transform:scale(1.06);          /* 避免 blur 在边缘露白 */
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:#05070c;opacity:var(--page-bg-d,0);
  }

  /* ---------- 背景：结果卡 ---------- */
  .rc .rbg{
    position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;overflow:hidden;
  }
  .rc .rbg i{
    position:absolute;inset:0;display:block;
    background-color:var(--bgc,transparent);
    background-image:var(--bgimg,none);
    background-size:cover;
    background-position:var(--bgpos,center);
    background-repeat:no-repeat;
    opacity:var(--bgop,1);
    filter:blur(var(--bgblur,0px));
    transform:scale(1.08);
  }
  .rc .rbg b{
    position:absolute;inset:0;display:block;
    background:#05070c;opacity:var(--bgdim,0);
  }
  .rc > *:not(.rbg){ position:relative;z-index:1; }
  .rc::after{ z-index:2; }

  /* ---------- 顶部 ---------- */
  .top{
    position:sticky;top:0;z-index:30;
    padding:calc(10px + var(--sat)) 16px 10px;
    background:rgba(13,15,20,.86);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .mark{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--gold),var(--gold-dim));
    color:#161009;font-weight:900;font-size:15px;
    box-shadow:0 5px 16px -6px rgba(232,178,95,.6);
  }
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:.4px}
  .brand h1 b{color:var(--gold)}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:2px}

  /* ---------- 分段控件 ---------- */
  .seg{
    display:flex;gap:4px;margin-top:11px;padding:4px;
    background:#0a0c11;border:1px solid var(--line);border-radius:12px;
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);
    font:700 13px/1 inherit;padding:11px 6px;border-radius:9px;
    cursor:pointer;transition:.16s;
  }
  .seg button[aria-selected="true"]{
    background:linear-gradient(180deg,#232a3a,#1b212d);color:var(--ink);
    box-shadow:0 2px 10px -4px #000, inset 0 1px 0 rgba(255,255,255,.05);
  }
  .seg button[aria-selected="true"] .dot{background:var(--gold)}

  /* ---------- 面板 ---------- */
  .panel{display:none;padding:16px 16px 0}
  .panel.on{display:block;animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:14px;
  }
  .label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:9px}

  /* ---------- 金额输入 ---------- */
  .money{display:flex;align-items:center;gap:10px}
  .money .cur{font:900 24px/1 ui-monospace,Consolas,monospace;color:var(--gold)}
  #total{
    flex:1;min-width:0;background:#0a0c11;border:1.6px solid var(--line);border-radius:13px;
    color:var(--ink);font:800 30px/1.1 ui-monospace,Consolas,monospace;
    padding:13px 14px;letter-spacing:1px;outline:none;
    font-variant-numeric:tabular-nums;transition:border-color .16s,box-shadow .16s;
  }
  #total:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,178,95,.12)}
  #total::placeholder{color:#39415a;font-weight:700;font-size:20px}
  .money .unit{color:var(--muted);font-size:14px;font-weight:700}
  .presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .presets button{
    flex:0 0 auto;font:700 12.5px/1 inherit;padding:9px 13px;border-radius:9px;
    background:#1e2431;color:#b9c2d4;border:1px solid var(--line);cursor:pointer;
  }
  .presets button:active{background:#252c3c;transform:translateY(1px)}

  /* ---------- 四张结果卡 ---------- */
  .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  @media (max-width:400px){ .grid{grid-template-columns:1fr} }
  .rc{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:14px;
    box-shadow:0 16px 34px -28px #000;
    transition:transform .18s;
  }
  .rc:active{transform:scale(.985)}
  .rc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--a)}
  .rc::after{
    content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;
    border-radius:50%;background:var(--a);opacity:.11;
  }
  .rc .pct{
    display:inline-block;font:800 12px/1 ui-monospace,Consolas,monospace;
    color:var(--a);background:color-mix(in srgb,var(--a) 14%, transparent);
    border:1px solid color-mix(in srgb,var(--a) 34%, transparent);
    padding:5px 9px;border-radius:999px;
  }
  .rc .nm{font-size:14px;font-weight:800;margin:10px 0 2px;line-height:1.3}
  .rc .amt{
    margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
    font:800 25px/1.1 ui-monospace,Consolas,monospace;
    font-variant-numeric:tabular-nums;word-break:break-all;
  }
  .rc .amt .dec{font-size:.6em;color:var(--muted)}
  .rc .amt .y{font-size:.46em;color:var(--muted);margin-left:4px;font-weight:700}
  .rc .cn{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .rc .ds{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

  /* ---------- 校验条 ---------- */
  .check{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:13px 15px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(180deg,#151a24,#11151d);font-size:12.5px;color:var(--muted);
    margin-bottom:14px;
  }
  .check code{
    font-family:ui-monospace,Consolas,monospace;color:var(--ink);
    background:#0a0c11;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .check .ok{color:var(--ok);font-weight:800}
  .check .warn{color:var(--warn);font-weight:800}
  .check .bad{color:var(--bad);font-weight:800}

  /* ---------- 设置页 ---------- */
  .row{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
    position:relative;overflow:hidden;
  }
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}
  .row .no{
    position:absolute;right:12px;top:12px;font:900 11px/1 ui-monospace,monospace;
    color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:6px;
  }
  .fld{margin-bottom:10px}
  .fld:last-child{margin-bottom:0}
  .fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:.3px}
  .fld input[type=text]{
    width:100%;background:#0a0c11;border:1.4px solid var(--line);border-radius:10px;
    color:var(--ink);font:600 15px/1.2 inherit;padding:11px 12px;outline:none;
    transition:border-color .16s;
  }
  .fld input[type=text]:focus{border-color:var(--a)}
  .fld input.err{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(240,138,138,.12)}
  .two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
  .pctwrap{position:relative}
  .pctwrap input{width:100%;background:#0a0c11;border:1.4px solid var(--line);border-radius:10px;
    color:var(--ink);font:800 17px/1.2 ui-monospace,Consolas,monospace;
    padding:11px 30px 11px 12px;outline:none;font-variant-numeric:tabular-nums}
  .pctwrap input:focus{border-color:var(--a)}
  .pctwrap .pc{position:absolute;right:11px;top:50%;transform:translateY(-50%);
    color:var(--muted);font:800 13px/1 ui-monospace,monospace;pointer-events:none}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .sw{
    width:28px;height:28px;border-radius:9px;border:2px solid transparent;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
  .colorin{
    width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:9px;
    background:#0a0c11;cursor:pointer;
  }
  .del{
    margin-top:11px;width:100%;font:700 12.5px/1 inherit;padding:10px;border-radius:10px;
    background:#241a1e;color:#f3a2a2;border:1px solid #4a2b31;cursor:pointer;
  }

<script>
(function(){
'use strict';

/* ============================================================
   默认配置：50 / 20 / 20 / 10
   出处见「方法」页
   ============================================================ */
/* ============================================================
   配置：默认值 / 读写 / 规范化
   ============================================================ */
var DEFAULT_CFG = {
  subtitle:'输入到手总额，按你的占比切成四份',
  presets:'5000,8000,12000,20000',
  pageBg:{ type:'none', color:'#141821', imageId:'', opacity:100, blur:0, dim:0, pos:'center' },
  modules:[
    { id:'m1', pct:50, name:'生存 · 必要开支', color:'#e8b25f',
      desc:'房租房贷、三餐、水电燃气、通勤、保险、最低还款。这一份管"活下去"。',
      bg:{ type:'none', color:'#141821', imageId:'', opacity:100, blur:0, dim:0, pos:'center' } },
    { id:'m2', pct:20, name:'未来 · 储蓄投资', color:'#5fd0b0',
      desc:'长期定投／养老 + 应急备用金。先付给未来的自己，再谈其他。',
      bg:{ type:'none', color:'#141821', imageId:'', opacity:100, blur:0, dim:0, pos:'center' } },
    { id:'m3', pct:20, name:'生活 · 享乐社交', color:'#7ba7f0',
      desc:'聚餐、旅行、爱好、想买的东西。这一份要花得痛快，不许有负罪感。',
      bg:{ type:'none', color:'#141821', imageId:'', opacity:100, blur:0, dim:0, pos:'center' } },
    { id:'m4', pct:10, name:'成长 · 学习保障', color:'#c98cf0',
      desc:'课程、书籍、证书、体检与额外保障。投向自己的人力资本，不是消费。',
      bg:{ type:'none', color:'#141821', imageId:'', opacity:100, blur:0, dim:0, pos:'center' } }
  ]
};
var PALETTE = ['#e8b25f','#5fd0b0','#7ba7f0','#c98cf0','#f08a8a','#8fd15f','#f0d05f','#5fc8f0','#d08cf0','#a0a8b8'];
var KEY = 'wage4.cfg.v1';
var KEY_TOTAL = 'wage4.total.v1';

/* ============================================================
   背景图存储（IndexedDB）
   localStorage 只有 ~5MB，存不下几张照片；图片统一放 IndexedDB。
   配置里只保存一个 imageId 引用。
   ============================================================ */
var IDB_NAME = 'wage4-bg', IDB_STORE = 'images';
function idbOpen(){
  return new Promise(function(res, rej){
    var idb = null;
    try{ idb = (typeof indexedDB !== 'undefined' && indexedDB) || (window && window.indexedDB) || null; }catch(e){}
    if (!idb) return rej(new Error('浏览器不支持 IndexedDB'));
    var rq = idb.open(IDB_NAME, 1);
    rq.onupgradeneeded = function(){
      var db = rq.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror = function(){ rej(rq.error || new Error('打开 IndexedDB 失败')); };
  });
}
function idbPut(key, val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = function(){ db.close(); res(key); };
      tx.onerror = function(){ db.close(); rej(tx.error); };
      tx.onabort = function(){ db.close(); rej(tx.error || new Error('写入被中止（可能超出配额）')); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var rq = tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess = function(){ db.close(); res(rq.result || null); };
      rq.onerror = function(){ db.close(); rej(rq.error); };
    });
  });
}
function idbDel(key){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = function(){ db.close(); res(); };
      tx.onerror = function(){ db.close(); res(); };
    });
  });
}
function idbAll(){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var rq = tx.objectStore(IDB_STORE).getAll();
      rq.onsuccess = function(){ db.close(); res(rq.result || []); };
      rq.onerror = function(){ db.close(); res([]); };
    });
  });
}

/* 读文件 → 等比缩放 → 压成 JPEG dataURL；同时采样主色用于自动配色 */
function processImage(file, maxW, quality){
  return new Promise(function(res, rej){
    if (!file) return rej(new Error('没有文件'));
    if (!/^image\//.test(file.type)) return rej(new Error('请选择图片文件'));
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var scale = Math.min(1, maxW / img.naturalWidth);
        var w = Math.max(1, Math.round(img.naturalWidth * scale));
        var h = Math.max(1, Math.round(img.naturalHeight * scale));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = cv.toDataURL('image/jpeg', quality);
        // 采样平均色（缩到 1x1 再读像素），用于自动挑一个协调的强调色
        var tiny = document.createElement('canvas');
        tiny.width = 8; tiny.height = 8;
        var tc = tiny.getContext('2d');
        tc.drawImage(img, 0, 0, 8, 8);
        var px = tc.getImageData(0, 0, 8, 8).data;
        var r = 0, g = 0, b = 0, n = 0;
        for (var i = 0; i < px.length; i += 4){ r += px[i]; g += px[i + 1]; b += px[i + 2]; n++; }
        r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
        // 提亮并饱和一点，避免取到接近黑的颜色
        var mx = Math.max(r, g, b) || 1;
        var k = 200 / mx;
        r = Math.min(255, Math.round(r * k));
        g = Math.min(255, Math.round(g * k));
        b = Math.min(255, Math.round(b * k));
        var hex = '#' + [r, g, b].map(function(v){ return v.toString(16).padStart(2, '0'); }).join('');
        URL.revokeObjectURL(url);
        res({ dataUrl: dataUrl, w: w, h: h, dominant: hex, bytes: dataUrl.length });
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('图片解码失败')); };
    img.src = url;
  });
}

/* 背景解析：兼容旧配置（字符串 = 颜色） */
function parseBg(v){
  if (typeof v === 'string') return { type: v ? 'color' : 'none', color: v || '#141821', imageId: '', opacity: 100, blur: 0, dim: 0, pos: 'center' };
  var d = { type: 'none', color: '#141821', imageId: '', opacity: 100, blur: 0, dim: 0, pos: 'center' };
  if (!v || typeof v !== 'object') return d;
  if (v.type === 'color' || v.type === 'image' || v.type === 'none') d.type = v.type;
  if (/^#[0-9a-f]{6}$/i.test(v.color)) d.color = v.color;
  if (typeof v.imageId === 'string') d.imageId = v.imageId;
  var clamp = function(x, lo, hi, def){ x = parseFloat(x); return isFinite(x) ? Math.min(hi, Math.max(lo, x)) : def; };
  d.opacity = clamp(v.opacity, 0, 100, 100);
  d.blur = clamp(v.blur, 0, 24, 0);
  d.dim = clamp(v.dim, 0, 80, 0);
  d.pos = ['center','top','bottom','left','right'].indexOf(v.pos) >= 0 ? v.pos : 'center';
  return d;
}

/* 把背景写到元素上 */
function applyBgTo(el, bg, dataUrl){
  var d = parseBg(bg);
  if (d.type === 'color' || d.type === 'none'){
    el.style.setProperty('--bgc', d.type === 'none' ? 'transparent' : d.color);
    el.style.setProperty('--bgimg', 'none');
  } else if (d.type === 'image' && dataUrl){
    el.style.setProperty('--bgc', d.color);
    el.style.setProperty('--bgimg', 'url("' + dataUrl + '")');
  } else {
    // 选了图片但图丢了：退回纯色，避免出现空白
    el.style.setProperty('--bgc', d.color);
    el.style.setProperty('--bgimg', 'none');
  }
  el.style.setProperty('--bgop', String(d.opacity / 100));
  el.style.setProperty('--bgblur', d.blur + 'px');
  el.style.setProperty('--bgpos', d.pos);
  el.style.setProperty('--bgdim', String(d.dim / 100));
}

/* 收集配置里所有用到的 imageId */
function usedImageIds(c){
  var out = [];
  var push = function(b){ var d = parseBg(b); if (d.type === 'image' && d.imageId) out.push(d.imageId); };
  push(c.pageBg);
  (c.modules || []).forEach(function(m){ push(m.bg); });
  return out.filter(function(v, i, a){ return a.indexOf(v) === i; });
}
function loadCfg(){
  try{
    var raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULT_CFG);
    var c = JSON.parse(raw);
    if (!c || !Array.isArray(c.modules) || !c.modules.length) return clone(DEFAULT_CFG);
    return normalize(c);
  }catch(e){ return clone(DEFAULT_CFG); }
}
function saveCfg(c){
  try{ localStorage.setItem(KEY, JSON.stringify(c)); }catch(e){}
}
function normalize(c){
  var out = {
    subtitle: typeof c.subtitle === 'string' && c.subtitle ? c.subtitle : DEFAULT_CFG.subtitle,
    presets:  typeof c.presets  === 'string' ? c.presets : DEFAULT_CFG.presets,
    pageBg:   parseBg(c.pageBg),
    modules:  []
  };
  c.modules.forEach(function(m, i){
    var pct = parseFloat(m && m.pct);
    if (!isFinite(pct) || pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    pct = Math.round(pct * 1000) / 1000;             // 支持 12.5% 这类小数
    out.modules.push({
      id:    (m && m.id) || ('m' + (i + 1) + '_' + Math.random().toString(36).slice(2, 7)),
      pct:   pct,
      name:  String((m && m.name) || ('模块 ' + (i + 1))).slice(0, 24),
      color: /^#[0-9a-f]{6}$/i.test(m && m.color) ? m.color : PALETTE[i % PALETTE.length],
      desc:  String((m && m.desc) || '').slice(0, 120),
      bg:    parseBg(m && m.bg)
    });
  });
  return out;
}
function clone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return {}; } }

var cfg = loadCfg();
var draft = clone(cfg);          // 自定义页的编辑草稿
var dirty = false;
var imgCache = {};               // imageId -> dataUrl

/* ============================================================
   金额解析与分配
   ============================================================ */
function parseAmount(raw){
  if (raw == null) return 0;
  var str = String(raw);
  if (/[-−—–]/.test(str)) return 0;                 // 负数视为无效
  var s = str
    .replace(/[，,\s¥￥$元]/g, '')
    .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[．。]/g, '.')
    .replace(/[^0-9.]/g, '');
  if (s === '' || s === '.') return 0;
  var p = s.split('.');
  if (p.length > 2) s = p[0] + '.' + p.slice(1).join('');
  var v = parseFloat(s);
  if (!isFinite(v) || v < 0) return 0;
  return Math.round(v * 100);
}
function hasNegative(raw){ return /[-−—–]/.test(String(raw == null ? '' : raw)); }

/* 最大余额法：结果之和恒等于 totalCents */
function allocate(totalCents, pcts){
  var out = pcts.map(function(p){
    var exact = totalCents * p / 100;
    var base = Math.floor(exact + 1e-9);
    return { base: base, frac: exact - base };
  });
  var used = out.reduce(function(a, o){ return a + o.base; }, 0);
  var rest = totalCents - used;
  var order = out.map(function(_, i){ return i; }).sort(function(a, b){
    if (out[b].frac !== out[a].frac) return out[b].frac - out[a].frac;
    return a - b;
  });
  for (var i = 0; i < rest; i++) out[order[i % order.length]].base += 1;
  return out.map(function(o){ return o.base; });
}

/* ============================================================
   格式化
   ============================================================ */
function fmt(cents){
  var neg = cents < 0; if (neg) cents = -cents;
  var y = String(Math.floor(cents / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return { y: (neg ? '-' : '') + y, d: String(cents % 100).padStart(2, '0') };
}
function plain(cents){ var f = fmt(cents); return f.y + '.' + f.d; }

var CN_NUM = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
var CN_UNIT = ['','拾','佰','仟'];
var CN_SEC = ['','万','亿','万亿'];
function cnSection(n){
  var s = '', zero = false, i = 0;
  while (n > 0){
    var d = n % 10;
    if (d === 0){ if (s !== '') zero = true; }
    else { s = CN_NUM[d] + CN_UNIT[i] + (zero ? '零' : '') + s; zero = false; }
    n = Math.floor(n / 10); i++;
  }
  return s === '' ? null : s;
}
function cnInteger(n){
  n = Math.floor(n);
  if (n === 0) return '零';
  var secs = [], t = n;
  while (t > 0){ secs.push(t % 10000); t = Math.floor(t / 10000); }
  var s = '';
  for (var i = secs.length - 1; i >= 0; i--){
    var part = cnSection(secs[i]);
    if (part === null){
      var lower = false;
      for (var k = i - 1; k >= 0; k--) if (secs[k] !== 0){ lower = true; break; }
      if (lower && s !== '' && s.charAt(s.length - 1) !== '零') s += '零';
    } else {
      if (s !== '' && secs[i] < 1000 && s.charAt(s.length - 1) !== '零') s += '零';
      s += part + CN_SEC[i];
    }
  }
  return s;
}
function cnMoney(cents){
  if (cents === 0) return '零元整';
  var yuan = Math.floor(cents / 100), jiao = Math.floor((cents % 100) / 10), fen = cents % 10;
  var s = '';
  if (yuan > 0) s += cnInteger(yuan) + '元';
  if (jiao === 0 && fen === 0) return s + '整';
  if (jiao > 0) s += CN_NUM[jiao] + '角';
  else if (yuan > 0) s += '零';
  if (fen > 0) s += CN_NUM[fen] + '分';
  return s;
}

/* ============================================================
   视图：分配页
   ============================================================ */
var elTotal  = document.getElementById('total');
var elGrid   = document.getElementById('grid');
var elCkL    = document.getElementById('ckLeft');
var elCkR    = document.getElementById('ckRight');
var elCnNote = document.getElementById('cnNote');
var elPresets= document.getElementById('presets');
var elSub    = document.getElementById('subtitle');
var lastText = '';

function buildPresets(){
  var list = String(cfg.presets || '').split(/[,，]/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s !== ''; }).slice(0, 6);
  elPresets.innerHTML = '';
  list.forEach(function(v){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = v;
    b.addEventListener('click', function(){ elTotal.value = v; render(); });
    elPresets.appendChild(b);
  });
}
function buildCards(){
  elGrid.innerHTML = '';
  cfg.modules.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'rc';
    d.style.setProperty('--a', m.color);
    d.innerHTML =
      '<span class="rbg"><i></i><b></b></span>' +
      '<span class="pct"></span>' +
      '<div class="nm"></div>' +
      '<div class="amt"><span class="v">0</span><span class="dec">.00</span><span class="y">元</span></div>' +
      '<div class="cn"></div>' +
      '<div class="ds"></div>';
    d.querySelector('.pct').textContent = fmtPct(m.pct) + '%';
    d.querySelector('.nm').textContent = m.name;
    d.querySelector('.ds').textContent = m.desc || '';
    applyBgTo(d, m.bg, imgCache[m.bg && m.bg.imageId]);
    elGrid.appendChild(d);
  });
}
function fmtPct(p){
  var s = (Math.round(p * 1000) / 1000).toString();
  return s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
}
function render(){
  var cents = parseAmount(elTotal.value);
  var pcts = cfg.modules.map(function(m){ return m.pct; });
  var parts = allocate(cents, pcts);
  var cards = elGrid.children;
  for (var i = 0; i < cards.length; i++){
    var c = cards[i], f = fmt(parts[i]);
    c.querySelector('.v').textContent   = f.y;
    c.querySelector('.dec').textContent = '.' + f.d;
    c.querySelector('.cn').textContent  = parts[i] > 0 ? cnMoney(parts[i]) : '';
  }
  var sum = parts.reduce(function(a, b){ return a + b; }, 0);
  elCkL.innerHTML = '四份合计 <code>¥' + plain(sum) + '</code>';
  if (hasNegative(elTotal.value)){
    elCkR.className = 'warn'; elCkR.textContent = '⚠ 已忽略负号，请输入正数';
  } else if (cents === 0){
    elCkR.className = ''; elCkR.textContent = '请输入金额';
  } else if (sum === cents){
    elCkR.className = 'ok'; elCkR.textContent = '✓ 分毫不差';
  } else {
    elCkR.className = 'bad'; elCkR.textContent = '✗ 差额 ' + plain(sum - cents);
  }
  elCnNote.textContent = cents > 0 ? '合计大写：' + cnMoney(cents) : '';
  try{ localStorage.setItem(KEY_TOTAL, elTotal.value); }catch(e){}
  lastText = '【工资四分法】总额 ¥' + plain(cents) + '\n' +
    cfg.modules.map(function(m, i){
      return fmtPct(m.pct) + '%  ' + m.name + '：¥' + plain(parts[i]);
    }).join('\n');
}

/* ============================================================
   视图：自定义页
   ============================================================ */
var elRows = document.getElementById('rows');
var elSumPct = document.getElementById('sumPct');
var elBtnFix = document.getElementById('btnFix');

function draftSum(){
  return draft.modules.reduce(function(a, m){
    var v = parseFloat(m.pct); return a + (isFinite(v) ? v : 0);
  }, 0);
}
function buildRows(){
  elRows.innerHTML = '';
  draft.modules.forEach(function(m, i){
    var r = document.createElement('div');
    r.className = 'row';
    r.style.setProperty('--a', m.color);
    r.innerHTML =
      '<span class="no">' + (i + 1) + '</span>' +
      '<div class="fld"><label>名称</label><input type="text" data-k="name" maxlength="24"></div>' +
      '<div class="two">' +
        '<div class="fld"><label>占比</label><div class="pctwrap">' +
          '<input type="text" inputmode="decimal" data-k="pct" maxlength="7"><span class="pc">%</span>' +
        '</div></div>' +
        '<div class="fld"><label>说明（可留空）</label><input type="text" data-k="desc" maxlength="120"></div>' +
      '</div>' +
      '<div class="fld"><label>强调色</label><div class="swatches"></div></div>' +
      '<div class="fld"><label>这张卡的背景</label></div>' +
      (draft.modules.length > 2 ? '<button class="del" type="button">删除这个模块</button>' : '');
    // 名称
    var inName = r.querySelector('[data-k=name]');
    inName.value = m.name;
    inName.addEventListener('input', function(){ m.name = inName.value.slice(0, 24); buildCardsFromDraft(); });
    // 占比
    var inPct = r.querySelector('[data-k=pct]');
    inPct.value = fmtPct(m.pct);
    inPct.addEventListener('input', function(){
      var v = parseFloat(inPct.value.replace(/[^\d.]/g, ''));
      m.pct = isFinite(v) ? Math.min(100, Math.max(0, Math.round(v * 1000) / 1000)) : 0;
      inPct.classList.toggle('err', !isFinite(v) && inPct.value !== '');
      updateSum();
    });
    inPct.addEventListener('blur', function(){ inPct.value = fmtPct(m.pct); });
    // 说明
    var inDesc = r.querySelector('[data-k=desc]');
    inDesc.value = m.desc;
    inDesc.addEventListener('input', function(){ m.desc = inDesc.value.slice(0, 120); });
    // 强调色
    var sw = r.querySelector('.swatches');
    PALETTE.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.style.background = c;
      b.setAttribute('aria-pressed', String(c.toLowerCase() === m.color.toLowerCase()));
      b.addEventListener('click', function(){
        m.color = c; r.style.setProperty('--a', c);
        sw.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        cin.value = c;
      });
      sw.appendChild(b);
    });
    var cin = document.createElement('input');
    cin.type = 'color'; cin.className = 'colorin'; cin.value = m.color;
    cin.addEventListener('input', function(){
      m.color = cin.value; r.style.setProperty('--a', m.color);
      sw.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
    });
    sw.appendChild(cin);
    // 背景设置
    r.appendChild(buildBgBox(function(){ return m.bg; }, function(v){ m.bg = v; commitBgLive(); }, i, m.color));
    // 删除
    var del = r.querySelector('.del');
    if (del) del.addEventListener('click', function(){
      draft.modules.splice(i, 1);
      buildRows(); updateSum();
    });
    elRows.appendChild(r);
  });
}

/* ============================================================
   背景设置控件（主页面 / 每个模块共用）
   bgRef: () => bg 对象；bgSet: (v) => void
   ============================================================ */
function buildBgBox(bgRef, bgSet, modIndex, accent){
  var box = document.createElement('div');
  box.className = 'bgbox';
  box.innerHTML = '<div class="tabs">' +
      '<button type="button" data-t="none">默认</button>' +
      '<button type="button" data-t="color">纯色</button>' +
      '<button type="button" data-t="image">图片</button>' +
    '</div><div class="body"></div>';
  var body = box.querySelector('.body');

  function paint(){
    var bg = parseBg(bgRef());
    box.querySelectorAll('.tabs button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-t') === bg.type));
    });
    body.innerHTML = '';

    // —— 图片部分 ——
    if (bg.type === 'image'){
      var src = document.createElement('div');
      src.className = 'bgsrc';
      src.innerHTML = '<label class="pick">' + (imgCache[bg.imageId] ? '重新选择图片' : '从相册选择图片') + '</label>' +
        '<input type="file" accept="image/*">' +
        (bg.imageId ? '<button type="button" class="mini">移除</button>' : '');
      var file = src.querySelector('input[type=file]');
      src.querySelector('.pick').addEventListener('click', function(){ file.click(); });
      file.addEventListener('change', function(){
        var f = file.files && file.files[0];
        if (!f) return;
        toast('正在处理图片…');
        processImage(f, 1280, 0.78).then(function(r){
          var id = 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
          return idbPut(id, { dataUrl: r.dataUrl, w: r.w, h: r.h, bytes: r.bytes, at: Date.now() }).then(function(){
            var old = bg.imageId;
            imgCache[id] = r.dataUrl;
            var nb = parseBg(bgRef());
            nb.imageId = id; nb.type = 'image';
            if (modIndex !== undefined && accent && (nb.color === DEFAULT_CFG.modules[0].bg.color || !nb.color)) nb.color = r.dominant;
            bgSet(nb);
            if (old && old !== id) idbDel(old).catch(function(){});
            paint(); thumb(); repaintCards();
            toast('背景已设置（' + Math.round(r.w) + '×' + Math.round(r.h) + '，' + Math.round(r.bytes / 1024) + 'KB）');
            updateQuota();
          });
        }).catch(function(e){ toast('图片处理失败：' + e.message); });
      });
      var rm = src.querySelector('.mini');
      if (rm) rm.addEventListener('click', function(){
        var old = bg.imageId;
        var nb = parseBg(bgRef()); nb.imageId = ''; nb.type = 'none';
        bgSet(nb);
        if (old) idbDel(old).catch(function(){});
        paint(); thumb(); repaintCards(); updateQuota();
        toast('已移除背景图');
      });
      body.appendChild(src);

      // 缩略预览
      var th = document.createElement('div');
      th.className = 'bgthumb';
      body.appendChild(th);
      thumb();

      // 不透明度 / 模糊 / 压暗
      slider(body, '不透明', 0, 100, 1, bg.opacity, function(v){
        var nb = parseBg(bgRef()); nb.opacity = v; bgSet(nb); thumb(); repaintCards();
      });
      slider(body, '模糊', 0, 24, 1, bg.blur, function(v){
        var nb = parseBg(bgRef()); nb.blur = v; bgSet(nb); thumb(); repaintCards();
      });
      slider(body, '压暗', 0, 80, 1, bg.dim, function(v){
        var nb = parseBg(bgRef()); nb.dim = v; bgSet(nb); thumb(); repaintCards();
      });
      // 位置
      var pos = document.createElement('div');
      pos.className = 'posrow';
      [['top','上'],['center','中'],['bottom','下'],['left','左'],['right','右']].forEach(function(p){
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = p[1];
        b.setAttribute('aria-pressed', String(bg.pos === p[0]));
        b.addEventListener('click', function(){
          var nb = parseBg(bgRef()); nb.pos = p[0]; bgSet(nb);
          pos.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          thumb(); repaintCards();
        });
        pos.appendChild(b);
      });
      body.appendChild(pos);
      // 图片透出时给文字一点保障
      var tip = document.createElement('div');
      tip.className = 'quota';
      tip.textContent = '提示：图片较花时把「压暗」调到 30%~50%，文字会更清楚。';
      body.appendChild(tip);
    }

    // —— 颜色部分（纯色模式，或图片背后的底色）——
    if (bg.type === 'color' || bg.type === 'image'){
      var row = document.createElement('div');
      row.className = 'colorrow';
      row.innerHTML = '<span style="font-size:11px;color:var(--muted);font-weight:700">' +
        (bg.type === 'image' ? '图片后方底色' : '背景色') + '</span><div class="swatches"></div>';
      var sws = row.querySelector('.swatches');
      ['#141821','#0d0f14','#1f1a2e','#12211f','#231a1a','#1a2330','#2a2118','#101820'].forEach(function(c){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'sw'; b.style.background = c;
        b.setAttribute('aria-pressed', String(c.toLowerCase() === bg.color.toLowerCase()));
        b.addEventListener('click', function(){
          var nb = parseBg(bgRef()); nb.color = c; bgSet(nb);
          sws.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          if (ci) ci.value = c;
          thumb(); repaintCards();
        });
        sws.appendChild(b);
      });
      var ci = document.createElement('input');
      ci.type = 'color'; ci.className = 'colorin'; ci.value = bg.color;
      ci.addEventListener('input', function(){
        var nb = parseBg(bgRef()); nb.color = ci.value; bgSet(nb);
        sws.querySelectorAll('.sw').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        thumb(); repaintCards();
      });
      sws.appendChild(ci);
      body.appendChild(row);
    }

    if (bg.type === 'none'){
      var n = document.createElement('div');
      n.className = 'quota';
      n.textContent = '使用应用默认样式（透明，露出主页面背景）。';
      body.appendChild(n);
    }
  }

  function thumb(){
    var bg = parseBg(bgRef());
    var th = body.querySelector('.bgthumb');
    if (!th) return;
    var url = imgCache[bg.imageId];
    th.style.backgroundImage = url ? 'url("' + url + '")' : 'none';
    th.style.backgroundColor = bg.color || '#141821';
    th.style.backgroundPosition = bg.pos;
    th.style.opacity = '1';
    th.textContent = url
      ? '不透明 ' + Math.round(bg.opacity) + '% · 模糊 ' + Math.round(bg.blur) + 'px · 压暗 ' + Math.round(bg.dim) + '%'
      : '尚未选择图片';
  }

  box.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.getAttribute('data-t');
      var bg = parseBg(bgRef());
      if (t === 'image' && !bg.imageId){
        // 切到图片但还没选图：先切模式，让用户看到选择器
        bg.type = 'image';
        bgSet(bg); paint(); repaintCards();
        setTimeout(function(){
          var f = box.querySelector('input[type=file]');
          if (f) f.click();
        }, 60);
        return;
      }
      bg.type = t;
      bgSet(bg); paint(); repaintCards();
    });
  });

  paint();
  return box;
}
/* 滑块小工具 */
function slider(parent, label, min, max, step, value, onInput){
  var row = document.createElement('div');
  row.className = 'slider';
  row.innerHTML = '<label>' + label + '</label><input type="range" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + value + '"><span class="val">' + Math.round(value) + '</span>';
  var inp = row.querySelector('input'), val = row.querySelector('.val');
  inp.addEventListener('input', function(){
    val.textContent = Math.round(inp.value);
    onInput(parseFloat(inp.value));
  });
  parent.appendChild(row);
  return row;
}
/* 主页面背景变化后重画 */
function repaintCards(){
  var cards = elGrid.children;
  if (cards.length !== cfg.modules.length) return;   // 数量不同时等保存后重建
  for (var i = 0; i < cards.length; i++){
    applyBgTo(cards[i], cfg.modules[i].bg, imgCache[cfg.modules[i].bg && cfg.modules[i].bg.imageId]);
  }
  applyPageBg();
}
/* 草稿里的背景改动要能立刻在主页面看到 */
function commitBgLive(){
  cfg.pageBg = parseBg(draft.pageBg);
  cfg.modules.forEach(function(m, i){ if (draft.modules[i]) m.bg = parseBg(draft.modules[i].bg); });
  repaintCards();
}
function buildCardsFromDraft(){
  // 编辑时立刻更新分配页名字/占比（颜色需要重建卡）
  var cards = elGrid.children;
  if (cards.length !== draft.modules.length){ buildCardsFromDraftFull(); return; }
  draft.modules.forEach(function(m, i){
    cards[i].querySelector('.nm').textContent = m.name;
    cards[i].querySelector('.pct').textContent = fmtPct(m.pct) + '%';
  });
}
function buildCardsFromDraftFull(){ /* 数量变化时留到保存后重建，避免半成品状态 */ }
function updateSum(){
  var s = Math.round(draftSum() * 1000) / 1000;
  elSumPct.textContent = fmtPct(s) + '%';
  var good = Math.abs(s - 100) < 1e-9 && draft.modules.length >= 2;
  elSumPct.className = 'big ' + (good ? 'ok' : 'bad');
  elBtnFix.hidden = good;
}
elBtnFix.addEventListener('click', function(){
  if (!draft.modules.length) return;
  var diff = Math.round((100 - draftSum()) * 1000) / 1000;
  var last = draft.modules[draft.modules.length - 1];
  var v = Math.round((last.pct + diff) * 1000) / 1000;
  if (v < 0){
    toast('差额过大，末位模块无法承受，请手动调整');
    return;                       // 不静默钳到 0，否则合计仍不等于 100
  }
  last.pct = Math.min(100, v);
  buildRows(); updateSum();
  toast('已把差额补到最后一个模块');
});

document.getElementById('btnAdd').addEventListener('click', function(){
  if (draft.modules.length >= 8){ toast('最多 8 个模块'); return; }
  var i = draft.modules.length;
  draft.modules.push({
    id: 'm' + Date.now().toString(36),
    pct: 0,
    name: '新模块 ' + (i + 1),
    color: PALETTE[i % PALETTE.length],
    desc: ''
  });
  buildRows(); updateSum();
});

// 标记「自定义页有未保存改动」，并用草稿即时预览背景
document.getElementById('setPresets').addEventListener('input', function(){ draft.presets = this.value; dirty = true; });
document.getElementById('setSubtitle').addEventListener('input', function(){ draft.subtitle = this.value; dirty = true; });

document.getElementById('btnSave').addEventListener('click', function(){
  if (draft.modules.length < 2){ toast('至少保留 2 个模块'); return; }
  var s = Math.round(draftSum() * 1000) / 1000;
  if (Math.abs(s - 100) >= 1e-9){ toast('占比合计需为 100%，当前 ' + fmtPct(s) + '%'); return; }
  var clean = normalize(draft);
  clean.subtitle = draft.subtitle;
  clean.presets  = draft.presets;
  clean.pageBg   = parseBg(draft.pageBg);
  clean.modules.forEach(function(m, i){
    if (draft.modules[i]) m.bg = parseBg(draft.modules[i].bg);
  });
  cfg = clean; draft = clone(cfg); dirty = false;
  saveCfg(cfg);
  applyCfg();
  // 清理不再被引用的背景图，避免 IndexedDB 里越堆越多
  var keep = usedImageIds(cfg);
  idbAll().then(function(all){
    var keys = Object.keys(all);
    keys.forEach(function(k){
      var id = all[k] && all[k].id;
      if (id && keep.indexOf(id) < 0) idbDel(id).catch(function(){});
    });
    updateQuota();
  }).catch(function(){});
  toast('已保存 ✓');
  switchTab('calc');
});

document.getElementById('btnReset').addEventListener('click', function(){
  if (!confirm('恢复为默认的 50/20/20/10？当前自定义设置会被覆盖。')) return;
  draft = clone(DEFAULT_CFG);
  fillConfigForm(); buildRows(); updateSum();
  toast('已载入默认值，点「保存设置」生效');
});

function fillConfigForm(){
  document.getElementById('setPresets').value  = draft.presets || '';
  document.getElementById('setSubtitle').value = draft.subtitle || '';
  var pbox = document.getElementById('pageBgBox');
  if (pbox){
    pbox.innerHTML = '';
    pbox.appendChild(buildBgBox(function(){ return draft.pageBg; }, function(v){ draft.pageBg = v; commitBgLive(); }, undefined, null));
  }
  updateQuota();
}
/* 估算已用存储（localStorage 配置 + IndexedDB 图片） */
function updateQuota(){
  var el = document.getElementById('quotaInfo');
  if (!el) return;
  var cfgBytes = 0;
  try{ cfgBytes = (localStorage.getItem(KEY) || '').length; }catch(e){}
  idbAll().then(function(all){
    var imgBytes = all.reduce(function(a, v){ return a + ((v && v.bytes) || 0); }, 0);
    var n = all.length;
    el.textContent = '已存背景图 ' + n + ' 张，约 ' + (imgBytes / 1024 / 1024).toFixed(1) +
      ' MB；配置约 ' + (cfgBytes / 1024).toFixed(1) + ' KB。图片存在本机，不会上传。';
  }).catch(function(){
    el.textContent = '配置约 ' + (cfgBytes / 1024).toFixed(1) + ' KB。图片存在本机，不会上传。';
  });
}
/* 从 IndexedDB 预载当前配置用到的所有背景图 */
function preloadImages(){
  var ids = usedImageIds(cfg);
  if (!ids.length) return Promise.resolve();
  return Promise.all(ids.map(function(id){
    return idbGet(id).then(function(v){
      if (v && v.dataUrl) imgCache[id] = v.dataUrl;
    }).catch(function(){});
  }));
}
/* 把主页面背景应用到 body */
function applyPageBg(){
  var d = parseBg(cfg.pageBg);
  var st = document.documentElement.style;
  if (d.type === 'image' && imgCache[d.imageId]){
    st.setProperty('--page-bg-c', d.color);
    st.setProperty('--page-bg-i', 'url("' + imgCache[d.imageId] + '")');
  } else if (d.type === 'color'){
    st.setProperty('--page-bg-c', d.color);
    st.setProperty('--page-bg-i', 'none');
  } else {
    st.setProperty('--page-bg-c', 'transparent');
    st.setProperty('--page-bg-i', 'none');
  }
  st.setProperty('--page-bg-o', String(d.opacity / 100));
  st.setProperty('--page-bg-b', d.blur + 'px');
  st.setProperty('--page-bg-p', d.pos);
  st.setProperty('--page-bg-d', String(d.dim / 100));
}
function applyCfg(){
  elSub.textContent = cfg.subtitle;
  document.title = '工资四分法';
  applyPageBg();
  buildPresets(); buildCards(); render();
}

function switchTab(name){
  document.querySelectorAll('.seg button').forEach(function(b){
    b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === name));
  });
  ['calc','cfg','doc'].forEach(function(k){
    document.getElementById('p-' + k).classList.toggle('on', k === name);
  });
  if (name === 'cfg'){
    draft = clone(cfg);
    fillConfigForm(); buildRows(); updateSum();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
});

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

elTotal.addEventListener('input', render);
elTotal.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ render(); elTotal.blur(); } });
document.getElementById('btnCalc').addEventListener('click', function(){ render(); toast('已计算'); });
document.getElementById('btnCopy').addEventListener('click', function(){
  var done = function(){ toast('已复制 ✓'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastText).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
});
